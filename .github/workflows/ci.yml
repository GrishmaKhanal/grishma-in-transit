name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # The integration tests create and drop a throwaway database next to this one.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # LayoutProps, RouteContext etc. are generated into .next/types, which a fresh checkout lacks.
      - run: npx next typegen && npx tsc --noEmit
      - run: npm test
      # Production dependencies must be clean. Dev tooling advisories are reported
      # but don't fail the job (some only have breaking "fixes").
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high || true
